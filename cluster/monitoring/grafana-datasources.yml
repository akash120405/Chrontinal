# Grafana Datasources — Cluster Mode (PC2)
# ClickHouse connects to PC1 via hostname resolved by extra_hosts
apiVersion: 1
datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: '15s'
      httpMethod: POST

  - name: ClickHouse
    type: grafana-clickhouse-datasource
    access: proxy
    editable: true
    jsonData:
      host: clickhouse01
      port: 8123
      protocol: http
      defaultDatabase: clif_logs
      username: $CLICKHOUSE_USER
    secureJsonData:
      password: $CLICKHOUSE_PASSWORD
