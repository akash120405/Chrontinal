      CONSUMER_FLUSH_INTERVAL_SEC: ${CONSUMER_FLUSH_INTERVAL_SEC:-1}
      CONSUMER_MAX_RETRIES: ${CONSUMER_MAX_RETRIES:-3}
      CONSUMER_POLL_BATCH: ${CONSUMER_POLL_BATCH:-50000}
      CONSUMER_FLUSH_WORKERS: ${CONSUMER_FLUSH_WORKERS:-4}
      LOG_LEVEL: INFO
    depends_on:
