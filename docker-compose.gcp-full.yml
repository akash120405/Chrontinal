        condition: service_healthy
      redpanda01:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
    networks:
      - clif-net
    healthcheck:
      test: ["CMD-SHELL", "nc -z clickhouse01 9000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging: *default-logging
    restart: unless-stopped
    deploy:
